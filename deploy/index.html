   STYLES — scientific-documentary HUD
   ===================================================================== */

.mono{font-family:var(--mono)}

  font-family:var(--mono);font-size:12px;letter-spacing:.14em;color:var(--dim);z-index:20;background:var(--bg);line-height:1.8}

<script type="module">
/* =====================================================================
   BLACKWELL — SILICON TO SCALE
   One continuous camera journey through a nested scale hierarchy.

   Architecture
   - Every scale "level" lives in its own local frame (m, mm, µm, 0.1µm,
     nm, Å) with a double-precision world offset + scale.
   - Each frame we re-centre and re-scale the world on the camera target
     (floating origin + floating scale), so float32 precision is never
     an issue across 11 orders of magnitude.
   - Camera = C1-continuous Hermite tracks (log distance, yaw, pitch,
     fov) + a zoom-aware target interpolation, then a critically damped
     time spring gives it mass.
   ===================================================================== */
// Three.js is inlined above (no network needed)
const { THREE, EffectComposer, RenderPass, UnrealBloomPass, ShaderPass, OutputPass, RoomEnvironment } = window.__THREE_BUNDLE__;

/* =====================================================================
   CONFIG
   ===================================================================== */
const params = new URLSearchParams(location.search);
/** accept a URL parameter only if it is one of the allowed values */
const pick = (name, allowed, fallback) => { const v = params.get(name); return allowed.includes(v) ? v : fallback; };
const IS_MOBILE = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) ||
  (matchMedia('(pointer:coarse)').matches && Math.min(screen.width, screen.height) < 820);
const CONFIG = {
  quality: pick('q', ['high', 'low'], IS_MOBILE || (navigator.hardwareConcurrency || 8) <= 4 ? 'low' : 'high'),
  frame: pick('frame', ['full', 'wide'], 'full'),          // 'full' = fill window (default) | 'wide' = 16:9 frame
  duration: 104,
  near: 0.004, far: 4000,
  bg: 0x030405, fogColor: 0x040507,
};
const QUALITY = {
  high: { pixelRatio: Math.min(devicePixelRatio, 2), msaa: 4, shadows: true, racks: 64, lattice: 9, particles: 1, atomDetail: 2 },
  low:  { pixelRatio: Math.min(devicePixelRatio, 1.3), msaa: 0, shadows: false, racks: 30, lattice: 6, particles: 0.45, atomDetail: 1 },
};
const QL = QUALITY[CONFIG.quality];

/* =====================================================================
   MATH / TIMING UTILITIES
   ===================================================================== */
const DEG = Math.PI / 180;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = t => { t = clamp(t); return t * t * (3 - 2 * t); };
const smoother = t => { t = clamp(t); return t * t * t * (t * (t * 6 - 15) + 10); };
/** fade in over [a,b], fade out over [c,d] (c,d optional) */
const win = (t, a, b, c = Infinity, d = Infinity) =>
  smoother((t - a) / Math.max(1e-6, b - a)) * (c === Infinity ? 1 : 1 - smoother((t - c) / Math.max(1e-6, d - c)));
/** Timeline warp: real playback time → story time. A smooth slow-motion
 *  hold over the exploded GPU gives time to read the part descriptions
 *  without re-timing anything else (all scene logic runs in story time). */
const STORY_END = 104;
const WARP = (() => {
  const dt = 0.01, rate = t => 1 - 0.7 * win(t, 20.5, 22, 28.5, 30.5);
  const story = [0]; let s = 0, t = 0;
  while (s < STORY_END) { s += rate(t) * dt; t += dt; story.push(s); }
  const n = story.length - 1;
  return {
    duration: n * dt,
    toStory(tr) { const x = clamp(tr / dt, 0, n), i = Math.min(n - 1, Math.floor(x)); return Math.min(STORY_END, lerp(story[i], story[i + 1], x - i)); },
    toReal(ts) { let lo = 0, hi = n; while (hi - lo > 1) { const m = (lo + hi) >> 1; if (story[m] < ts) lo = m; else hi = m; }
      return (lo + (ts - story[lo]) / Math.max(1e-9, story[hi] - story[lo])) * dt; },
  };
})();
CONFIG.duration = WARP.duration;
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rng = mulberry32(20250130);
const rr = (a, b) => a + (b - a) * rng();

/** Critically damped spring step (stable for any dt). */
function spring(x, v, target, omega, dt) {
  const f = 1 + 2 * dt * omega, oo = omega * omega, hoo = dt * oo, hhoo = dt * hoo, det = 1 / (f + hhoo);
  return [(f * x + dt * v + hhoo * target) * det, (v + hoo * (target - x)) * det];

/** C1 cubic Hermite track over non-uniform key times (Catmull-Rom style
 *  tangents, Fritsch–Carlson limited so it never overshoots). */
function makeTrack(times, values) {
  const n = times.length, m = new Array(n).fill(0);
  for (let i = 1; i < n - 1; i++) {
    const d0 = values[i] - values[i - 1], d1 = values[i + 1] - values[i];
    if (d0 * d1 <= 0) continue;
    const s0 = d0 / (times[i] - times[i - 1]), s1 = d1 / (times[i + 1] - times[i]);
    const c = (values[i + 1] - values[i - 1]) / (times[i + 1] - times[i - 1]);
    m[i] = Math.sign(c) * Math.min(Math.abs(c), 3 * Math.abs(s0), 3 * Math.abs(s1));
  }
  const seg = t => { let i = 0; while (i < n - 2 && t > times[i + 1]) i++; return i; };
  const f = t => {
    if (t <= times[0]) return values[0];
    if (t >= times[n - 1]) return values[n - 1];
    const i = seg(t), h = times[i + 1] - times[i], s = (t - times[i]) / h, s2 = s * s, s3 = s2 * s;
    return (2 * s3 - 3 * s2 + 1) * values[i] + (s3 - 2 * s2 + s) * h * m[i] +
           (-2 * s3 + 3 * s2) * values[i + 1] + (s3 - s2) * h * m[i + 1];
  };
  f.tangent = i => m[i];
  f.segment = seg;
  return f;

const hermite = (p0, m0, p1, m1, s) => {
  const s2 = s * s, s3 = s2 * s;
  return (2 * s3 - 3 * s2 + 1) * p0 + (s3 - 2 * s2 + s) * m0 + (-2 * s3 + 3 * s2) * p1 + (s3 - s2) * m1;
};

   SCENE / RENDERER
   ===================================================================== */
const stage = document.getElementById('stage');
const canvas = document.getElementById('gl');

  renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance', alpha: false, stencil: false });

  const el = document.getElementById('err'); el.style.display = 'flex';
  el.textContent = 'WEBGL IS NOT AVAILABLE IN THIS BROWSER — THE VISUALIZATION CANNOT START.';
  throw e;

renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = QL.shadows;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(CONFIG.bg);
scene.fog = new THREE.FogExp2(CONFIG.fogColor, 0.2);
const camera = new THREE.PerspectiveCamera(45, 16 / 9, CONFIG.near, CONFIG.far);
scene.add(camera);

/* =====================================================================

   ===================================================================== */

    m.userData.baseDepthWrite = m.depthWrite; this.mats.push(m); return m;

  world(x, y, z) { const o = this.offset, h = this.shift; return [o[0] + h[0] + this.scale * x, o[1] + h[1] + this.scale * y, o[2] + h[2] + this.scale * z]; }
  onUpdate(fn) { this.updaters.push(fn); }

    if (Math.abs(f - this.fade) < 1e-4) return;
    this.fade = f; this.group.visible = f > 0.002;
    for (const m of this.mats) {
      if (m.userData.setFade) { m.userData.setFade(f); continue; }
      m.opacity = m.userData.baseOpacity * f;
      const tr = m.userData.baseTransparent || f < 0.995;
      if (m.transparent !== tr) { m.transparent = tr; m.needsUpdate = true; }

/* =====================================================================

   ===================================================================== */
function canvasTex(w, h, draw, { repeat = [1, 1], srgb = true, aniso = 8 } = {}) {

  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat[0], repeat[1]);
  t.anisotropy = Math.min(aniso, renderer.capabilities.getMaxAnisotropy());

}
const TEX = {};
function buildTextures() {
  TEX.brushed = canvasTex(256, 256, (g, w, h) => {
    g.fillStyle = '#888'; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 1600; i++) { const y = rng() * h, v = 110 + rng() * 60 | 0;
      g.fillStyle = `rgba(${v},${v},${v},${0.25 + rng() * 0.3})`; g.fillRect(0, y, w, 0.6 + rng()); }
  }, { srgb: false });
  TEX.floor = canvasTex(512, 512, (g, w, h) => {
    g.fillStyle = '#1a1c1f'; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 9000; i++) { const v = 20 + rng() * 14 | 0; g.fillStyle = `rgb(${v},${v},${v + 2})`; g.fillRect(rng() * w, rng() * h, 1.5, 1.5); }
    g.strokeStyle = '#07080a'; g.lineWidth = 3;
    for (let i = 0; i <= 4; i++) { g.beginPath(); g.moveTo(i * w / 4, 0); g.lineTo(i * w / 4, h); g.stroke();
      g.beginPath(); g.moveTo(0, i * h / 4); g.lineTo(w, i * h / 4); g.stroke(); }
    g.fillStyle = '#23262a'; for (let i = 0; i < 16; i++) { if (rng() < .3) g.fillRect((i % 4) * w / 4 + 40, (i / 4 | 0) * h / 4 + 40, 48, 48); }
  }, { repeat: [30, 12] });
  TEX.door = canvasTex(128, 512, (g, w, h) => {           // perforated rack door with 1U server faces behind
    g.fillStyle = '#0c0d0f'; g.fillRect(0, 0, w, h);
    const U = h / 42;
    for (let u = 0; u < 42; u++) {
      const kind = rng();
      g.fillStyle = kind < .15 ? '#050506' : '#15171a'; g.fillRect(4, u * U + 1, w - 8, U - 1.5);
      if (kind > .15) { g.fillStyle = '#23262b'; for (let x = 10; x < w - 24; x += 5) g.fillRect(x, u * U + 3, 2.5, U - 6); }
    }
    g.fillStyle = 'rgba(0,0,0,.45)';
    for (let y = 0; y < h; y += 4) for (let x = (y / 4 % 2) * 2; x < w; x += 4) g.fillRect(x, y, 1.6, 1.6);
    g.fillStyle = '#1d1f23'; g.fillRect(0, 0, 4, h); g.fillRect(w - 4, 0, 4, h);
  });

    g.fillStyle = '#0b120e'; g.fillRect(0, 0, w, h);
    g.lineCap = 'round';
    const dirs = [[1, 0], [0, 1], [.707, .707], [-.707, .707]];
    for (let i = 0; i < 520; i++) {          // orthogonal/45° traces
      let x = rng() * w, y = rng() * h; const c = 60 + rng() * 50 | 0;
      g.strokeStyle = `rgba(${c + 40},${c + 18},${c - 30},${0.25 + rng() * 0.3})`; g.lineWidth = rng() < .8 ? 1.2 : 2.6;
      g.beginPath(); g.moveTo(x, y);
      for (let k = 0; k < 4; k++) { const d = (rng() * 4 | 0), L = 20 + rng() * 120; x += dirs[d][0] * L; y += dirs[d][1] * L; g.lineTo(x, y); }
      g.stroke();
      g.fillStyle = 'rgba(190,150,80,.55)'; g.beginPath(); g.arc(x, y, 2.2, 0, 7); g.fill();
    }
  }, { repeat: [1, 2] });
  TEX.substrate = canvasTex(1024, 1024, (g, w, h) => {
    g.fillStyle = '#16211b'; g.fillRect(0, 0, w, h);
    const cx = w / 2, cy = h / 2;
    for (let i = 0; i < 900; i++) {           // fan-out traces radiating from the die
      const a = rng() * Math.PI * 2, r0 = 300 + rng() * 20, r1 = r0 + 60 + rng() * 180;
      g.strokeStyle = `rgba(200,160,80,${0.18 + rng() * 0.25})`; g.lineWidth = .8;
      const x0 = cx + Math.cos(a) * r0, y0 = cy + Math.sin(a) * r0;
      const x1 = cx + Math.cos(a) * r1, y1 = cy + Math.sin(a) * r1;
      g.beginPath(); g.moveTo(x0, y0); g.lineTo((x0 + x1) / 2, y0); g.lineTo(x1, y1); g.stroke();

    }
  });

/** MeshStandardMaterial + procedural GLSL pattern driven by the unit-box
 *  local position (any InstancedMesh of scaled unit boxes can carry
 *  resolution-independent detail). Pattern signature:
 *    vec3 pattern(vec3 p, vec3 n, vec3 sc, float seed, inout vec3 em)
 *  p ∈ [-.5,.5]³ box-local, n object normal, sc instance scale.        */
const GLSL_LIB = `
float h11(float p){ p=fract(p*.1031); p*=p+33.33; p*=p+p; return fract(p); }

/* anti-aliased grid lines; fades to an average when cells become sub-pixel */
float gridAA(vec2 q, float w){ vec2 fw=fwidth(q)+1e-5; vec2 f=fract(q); vec2 d=min(f,1.-f)/fw;
  float l=1.-clamp(min(d.x,d.y)-w,0.,1.); return mix(.3,l,lodF(q)); }

float cellRows(vec2 q, float seed){ float row=floor(q.y); float k=.6+h11(row*1.7+seed)*.8; float x=(q.x+h11(row+seed)*7.)*k;
  float t=h21(vec2(floor(x),row+seed*13.)); float e=gridAA(vec2(x,q.y),.5);
  return mix(t,.15,e*.6); }

    Object.assign(sh.uniforms, u);
    const decl = Object.keys(u).filter(k => k !== 'uTime').map(k => {
      const v = u[k].value; const t = typeof v === 'number' ? 'float' : v.isVector2 ? 'vec2' : (v.isVector3 || v.isColor) ? 'vec3' : 'vec4';
      return `uniform ${t} ${k};`; }).join('\n');
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', `#include <common>
attribute float aSeed; varying vec3 vPP; varying vec3 vPN; varying vec3 vPS; varying float vSeed;`)
      .replace('#include <begin_vertex>', `#include <begin_vertex>
vPP=position; vPN=normal; vSeed=aSeed;
#ifdef USE_INSTANCING
vPS=vec3(length(instanceMatrix[0].xyz),length(instanceMatrix[1].xyz),length(instanceMatrix[2].xyz));
#else
vPS=vec3(1.);
#endif`);
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', `#include <common>
uniform float uTime; ${decl}
varying vec3 vPP; varying vec3 vPN; varying vec3 vPS; varying float vSeed;
${GLSL_LIB}
${patternGLSL}`)
      .replace('#include <map_fragment>', `#include <map_fragment>
{ vec3 pem=vec3(0.); vec3 pc=pattern(vPP,vPN,vPS,vSeed,pem); diffuseColor.rgb*=pc; totalEmissiveRadiance+=pem; }`);

/* =====================================================================

   ===================================================================== */
const UNIT_BOX = new THREE.BoxGeometry(1, 1, 1);

  const geo = new THREE.BufferGeometry();        // shares UNIT_BOX's GPU buffers; only aSeed is per mesh
  geo.setIndex(UNIT_BOX.index);

}

/** Glowing point sprites (LEDs, charge carriers, electron clouds).
 *  Sizes are in the level's local units so they scale with the world. */

    uniforms: { uTime: SHARED.uTime, uPx: SHARED.uPx, uOpacity: { value: 1 }, uBlink: { value: blink }, uGain: { value: 1 } },
    vertexShader: `
      attribute float aSize; attribute float aPhase; attribute vec3 aColor;

    vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }`,

   ===================================================================== */
/* Flagship-class triple-fan board (≈ 358 × 150 × 70 mm), styled after

   Card lies flat, fans up. Bracket at +z, flow-through fan at −z.       */
const GPU = { w: 0.15, l: 0.358, pcbW: 0.135, pcbZ0: -0.07, pcbZ1: 0.175, pkgZ: 0.045, rise: 0.16, fwd: 0.06, h: 0.069,

/* Exploded-view rig. The card rises out of the server (15→18.5 s), splits
   into layers (≈17.4→21.5 s), holds for the numbered read-out, then every
   layer except the board lifts/drops away (≈24.6→27.5 s) so the camera can

const EXPLODE = {
  order: ['shroud', 'fans', 'fins', 'vapor', 'pcb', 'power', 'back'],
  gap: { shroud: 0.25, fans: 0.163, fins: 0.1, vapor: 0.048, pcb: 0, power: -0.045, back: -0.088 },
  riseShift(t) { const k = 1 - smoother((t - 15) / 3.5); return [0, -GPU.rise * k, -GPU.fwd * k]; },
  offset(key, t) {

  fade(key, t) { return key === 'pcb' ? 1 : 1 - smoother((t - 25.0 - this.order.indexOf(key) * 0.1) / 2.4); },

const EXPLODE_TILT = { fans: [-0.5, 0.064], shroud: [-0.2, 0.069] };
function roundedRect(w, l, r) {
  const s = new THREE.Shape(), x = -w / 2, y = -l / 2;
  s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r);
  s.lineTo(x + w, y + l - r); s.quadraticCurveTo(x + w, y + l, x + w - r, y + l);
  s.lineTo(x + r, y + l); s.quadraticCurveTo(x, y + l, x, y + l - r); s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y);
  return s;
}
const FAN_Z = [0.115, 0, -0.115], FAN_R = 0.0505;
/** extruded shape lying in the XZ plane (shape y → +z), top at y = 0 */
function flatExtrude(shape, depth, bevel = 0, curve = 40) {
  const g = new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: bevel > 0, bevelThickness: bevel, bevelSize: bevel, bevelSegments: 3, curveSegments: curve });
  g.rotateX(Math.PI / 2); return g;
}
function withFanHoles(shape, r = FAN_R) {
  for (const z of FAN_Z) { const h = new THREE.Path(); h.absarc(0, z, r, 0, Math.PI * 2, true); shape.holes.push(h); }

const poly = pts => { const s = new THREE.Shape(); s.moveTo(pts[0][0], pts[0][1]); for (const p of pts.slice(1)) s.lineTo(p[0], p[1]); s.closePath(); return s; };

/** One swept fan blade in the XZ plane, centred on +x, thin in y. */
function fanBladeGeometry(r0, r1) {
  const s = new THREE.Shape(), N = 14, lead = [], trail = [];
  for (let i = 0; i <= N; i++) {
    const u = i / N, r = lerp(r0, r1, u);
    const sweep = 0.55 * Math.pow(u, 1.35);                  // forward-swept leading edge
    const width = lerp(0.42, 0.62, Math.sin(u * Math.PI * 0.85)); // chord (radians) — widest near the tip
    lead.push([Math.cos(sweep + width / 2) * r, Math.sin(sweep + width / 2) * r]);
    trail.push([Math.cos(sweep - width / 2) * r, Math.sin(sweep - width / 2) * r]);

  s.moveTo(...lead[0]); lead.slice(1).forEach(p => s.lineTo(...p));
  const tip = lead[N], tipT = trail[N];                       // rounded tip
  s.quadraticCurveTo((tip[0] + tipT[0]) / 2 * 1.04, (tip[1] + tipT[1]) / 2 * 1.04, ...tipT);
  trail.reverse().slice(1).forEach(p => s.lineTo(...p)); s.closePath();
  const g = new THREE.ExtrudeGeometry(s, { depth: 0.0009, bevelEnabled: true, bevelThickness: 0.0003, bevelSize: 0.0003, bevelSegments: 1, curveSegments: 8 });
  g.rotateX(-Math.PI / 2); return g;
}

  for (const [z, m] of [[FAN_Z[0], rgbA], [FAN_Z[1], rgbB]]) {
    const arc = new THREE.Mesh(new THREE.TorusGeometry(FAN_R + 0.0015, 0.0011, 8, 64, Math.PI * 0.9), m);
    arc.rotation.set(Math.PI / 2, 0, -Math.PI * 0.45); arc.position.set(0, H + 0.0035, z); G.shroud.add(arc);
  }
  G.shroud.add(box(silver, W / 2 + 0.0006, H - 0.0095, 0, 0.0012, 0.0016, Lc - 0.03));    // chamfer line
  // side vents on the +x face
  const vents = []; for (let z = -0.165; z <= 0.165; z += 0.011) vents.push({ x: W / 2 + 0.0005, y: 0.03, z, w: 0.0012, h: 0.03, d: 0.0055 });
  G.shroud.add(instBoxes(gunDark, vents, { shadow: false }));
  // I/O bracket
  const bracketMat = lm('shroud', std(0x8e939a, 1.0, 0.42, { roughnessMap: TEX.brushed, envMapIntensity: 0.7 }));
  G.shroud.add(box(bracketMat, -0.004, H / 2 - 0.004, Lc / 2 + 0.0008, W + 0.012, H + 0.004, 0.0012));
  const ports = []; for (let i = 0; i < 5; i++) ports.push({ x: -0.055 + i * 0.022, y: 0.012, z: Lc / 2 + 0.0016, w: 0.016, h: 0.007, d: 0.001 });
  for (let i = 0; i < 18; i++) ports.push({ x: -0.06 + (i % 9) * 0.0145, y: 0.035 + Math.floor(i / 9) * 0.014, z: Lc / 2 + 0.0016, w: 0.011, h: 0.009, d: 0.001 });
  G.shroud.add(instBoxes(gunDark, ports, { shadow: false }));

  // ---- 2 · FANS: three large fans with swept blades ----
  const bladeMat = lm('fans', std(0x2c2e33, 0.55, 0.28, { side: THREE.DoubleSide, envMapIntensity: 1.5 }));
  const hubMat = lm('fans', std(0x2a2c30, 0.8, 0.25, { envMapIntensity: 1.5 }));
  const hubRing = lm('fans', std(0x9fa4ab, 1.0, 0.18));
  const wallMat = lm('fans', std(0x0c0d0f, 0.4, 0.55, { side: THREE.DoubleSide }));
  const bladeGeo = fanBladeGeometry(0.0165, FAN_R - 0.0025), wallGeo = new THREE.CylinderGeometry(FAN_R, FAN_R, 0.016, 64, 1, true);
  const rotors = [];
  FAN_Z.forEach((z, fi) => {
    const wall = new THREE.Mesh(wallGeo, wallMat); wall.position.set(0, H - 0.008, z); G.fans.add(wall);
    const rotor = new THREE.Group(); rotor.position.set(0, H - 0.005, z);
    const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.017, 0.0175, 0.008, 48), hubMat); rotor.add(hub);
    const hr = new THREE.Mesh(new THREE.TorusGeometry(0.0125, 0.0007, 8, 48), hubRing); hr.rotation.x = Math.PI / 2; hr.position.y = 0.0041; rotor.add(hr);
    const dir = fi === 1 ? -1 : 1;                               // centre fan counter-rotates
    for (let b = 0; b < 11; b++) {
      const holder = new THREE.Group(); holder.rotation.y = b / 11 * Math.PI * 2;
      const bl = new THREE.Mesh(bladeGeo, bladeMat); bl.rotation.x = 0.38 * dir; if (dir < 0) bl.scale.z = -1;
      holder.add(bl); rotor.add(holder);
    }
    rotor.userData.dir = dir; G.fans.add(rotor); rotors.push(rotor);
  });
  // fan cage / cross-frame under the blades
  const cageMat = lm('fans', std(0x2b2e33, 0.85, 0.3, { roughnessMap: TEX.brushed, envMapIntensity: 1.2 }));
  const cage = new THREE.Mesh(flatExtrude(withFanHoles(roundedRect(W - 0.008, Lc - 0.008, 0.008), FAN_R - 0.0005), 0.0016, 0.0005), cageMat);
  cage.position.y = H - 0.001; G.fans.add(cage);
  G.fans.traverse(o => { o.receiveShadow = false; });            // keep the fans readable under the lifted shroud

  // ---- 3 · FIN STACK ----
  const fin = lm('fins', std(0x9ea3a9, 1.0, 0.36));
  const fins = []; for (let z = -0.172; z <= 0.1721; z += 0.0024) fins.push({ x: 0, y: 0.0305, z, w: 0.138, h: 0.042, d: 0.0004 });
  G.fins.add(instBoxes(fin, fins));
  const finRail = lm('fins', std(0x5d6268, 1.0, 0.3));
  G.fins.add(box(finRail, 0, 0.0092, 0, 0.14, 0.001, 0.346), box(finRail, 0.0695, 0.0305, 0, 0.001, 0.042, 0.346), box(finRail, -0.0695, 0.0305, 0, 0.001, 0.042, 0.346));

  // ---- 4 · VAPOR CHAMBER + HEAT PIPES (run into the flow-through section) ----
  const copper = lm('vapor', std(0xc27c46, 1.0, 0.24, { envMapIntensity: 1.25 }));
  const copperDark = lm('vapor', std(0x8a5230, 1.0, 0.34));
  const nickel = lm('vapor', std(0xc9ccd1, 1.0, 0.18));
  G.vapor.add(box(copper, 0, 0.0045, GPU.pkgZ, 0.112, 0.0034, 0.15), box(nickel, 0, 0.0022, GPU.pkgZ, 0.034, 0.0012, 0.034));
  for (let i = 0; i < 6; i++) {
    const x = -0.05 + i * 0.02;
    G.vapor.add(new THREE.Mesh(tubeAlong([[x, 0.0076, 0.13], [x, 0.0076, -0.06], [x, 0.012, -0.12], [x, 0.02, -0.17], [x * 0.95, 0.03, -0.176]], 0.0029), copper));
  }
  G.vapor.add(box(copperDark, 0, 0.0082, GPU.pkgZ, 0.118, 0.0012, 0.02));

  // ---- 5–7 · BOARD: PCB, package (L3), memory, power stages — stays in place ----
  const M = {
    pcb: L.reg(std(0xffffff, 0.3, 0.55, { map: TEX.pcb })),
    mem: L.reg(std(0x0f1012, 0.2, 0.55)),
    choke: L.reg(std(0x3a3d42, 0.7, 0.45)),
    cap: L.reg(std(0x7b7f86, 0.9, 0.35)),
    gold: L.reg(std(0xcaa34c, 1.0, 0.28)),
    frame: L.reg(std(0x7d8288, 1.0, 0.48, { envMapIntensity: 0.7 })),
  };
  const P = G.pcb, pz = GPU.pkgZ, pcbL = GPU.pcbZ1 - GPU.pcbZ0, pcbC = (GPU.pcbZ1 + GPU.pcbZ0) / 2;
  P.add(box(M.pcb, 0, -0.0008, pcbC, GPU.pcbW, 0.0016, pcbL));
  const fingers = []; for (let i = 0; i < 44; i++) fingers.push({ x: -GPU.pcbW / 2 - 0.004, y: -0.0008, z: 0.04 + i * 0.0026, w: 0.008, h: 0.0017, d: 0.0017 });
  P.add(instBoxes(M.gold, fingers, { shadow: false }));
  const r = 0.034;
  P.add(box(M.frame, 0, 0.0008, pz - r, 2 * r, 0.0016, 0.004), box(M.frame, 0, 0.0008, pz + r, 2 * r, 0.0016, 0.004),
        box(M.frame, -r, 0.0008, pz, 0.004, 0.0016, 2 * r), box(M.frame, r, 0.0008, pz, 0.004, 0.0016, 2 * r));
  const mems = [], memCenters = [];
  for (const o of [-0.027, -0.009, 0.009, 0.027]) memCenters.push([-0.049, pz + o], [0.049, pz + o], [o, pz - 0.048], [o, pz + 0.048]);
  memCenters.forEach(([x, z]) => { const vert = Math.abs(x) > 0.04; mems.push({ x, y: 0.00055, z, w: vert ? 0.012 : 0.0145, h: 0.0011, d: vert ? 0.0145 : 0.012 }); });
  P.add(instBoxes(M.mem, mems));
  const chokes = [], caps = [];
  for (const zr of [0.118, 0.132, -0.022, -0.036]) for (let i = 0; i < 10; i++) chokes.push({ x: -0.0495 + i * 0.011, y: 0.0035, z: zr, w: 0.008, h: 0.007, d: 0.008 });
  for (const zr of [0.148, 0.16, -0.05, -0.062]) for (let i = 0; i < 16; i++) caps.push([-0.055 + i * 0.0073, zr]);
  P.add(instBoxes(M.choke, chokes));
  const capMesh = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.0024, 0.0024, 0.0045, 14), M.cap, caps.length);
  caps.forEach(([x, z], i) => { _m4.makeTranslation(x, 0.00225, z); capMesh.setMatrixAt(i, _m4); });
  capMesh.castShadow = QL.shadows; capMesh.frustumCulled = false; P.add(capMesh);
  const traces = new THREE.Group(); P.add(traces);
  memCenters.forEach(([x, z], i) => {
    const mid = Math.abs(x) > 0.04 ? [x * 0.72, 0.0002, z] : [x, 0.0002, pz + (z - pz) * 0.72];
    traces.add(createDataPulse(L, [[x * 0.93, 0.0002, pz + (z - pz) * 0.93], mid, [x * 0.5, 0.0002, pz + (z - pz) * 0.5]], 0.00022,
      i % 3 ? 0xe8b862 : 0x86d7e2, { count: 2, speed: 0.35 + (i % 4) * 0.05, base: 0.25, width: 0.07 }));
  });

  // ---- 8 · POWER INPUT (12 V connector module) ----
  const pwrBoard = lm('power', std(0xffffff, 0.3, 0.55, { map: TEX.pcb }));
  const pwrHousing = lm('power', std(0x0b0b0c, 0.1, 0.7));
  const pwrPin = lm('power', std(0xcaa34c, 1.0, 0.28));
  G.power.add(box(pwrBoard, 0.04, -0.0035, -0.055, 0.05, 0.0014, 0.03), box(pwrHousing, 0.045, -0.0085, -0.06, 0.026, 0.009, 0.009));
  const pins = []; for (let i = 0; i < 8; i++) for (const zz of [-0.0022, 0.0022]) pins.push({ x: 0.0345 + i * 0.003, y: -0.0133, z: -0.06 + zz, w: 0.0014, h: 0.0008, d: 0.0014 });
  G.power.add(instBoxes(pwrPin, pins, { shadow: false }));

  // ---- 9 · BACKPLATE (full length, grille over the flow-through section) ----
  const back = lm('back', std(0x1a1c20, 0.85, 0.34, { roughnessMap: TEX.brushed, envMapIntensity: 1.0 }));
  const backSilver = lm('back', std(0xaeb3ba, 1.0, 0.22));
  const flowL = GPU.pcbZ0 + Lc / 2;
  G.back.add(box(back, 0, -0.0045, pcbC + 0.0015, W, 0.002, pcbL + 0.008));
  const slats = []; for (let z = -Lc / 2 + 0.006; z < GPU.pcbZ0 - 0.004; z += 0.006) slats.push({ x: 0, y: -0.0045, z, w: W - 0.01, h: 0.002, d: 0.0028 });
  G.back.add(instBoxes(back, slats, { shadow: false }));
  G.back.add(box(back, W / 2 - 0.0025, -0.0045, -Lc / 2 + flowL / 2, 0.005, 0.002, flowL), box(back, -W / 2 + 0.0025, -0.0045, -Lc / 2 + flowL / 2, 0.005, 0.002, flowL));
  G.back.add(box(backSilver, 0.03, -0.0057, 0.06, 0.004, 0.0005, 0.2), box(backSilver, 0.045, -0.0057, 0.12, 0.03, 0.0005, 0.004));

  L.onUpdate((t, dt) => {
    for (const k of EXPLODE.order) {
      if (k === 'pcb') continue;
      const off = EXPLODE.offset(k, t);
      G[k].position.y = off;
      const tl = EXPLODE_TILT[k];
      if (tl) {                                   // rotate about the layer's own centre line (∥ z)
        const th = tl[0] * clamp(off / EXPLODE.gap[k]), cy = tl[1];
        G[k].rotation.z = th; G[k].position.x = Math.sin(th) * cy; G[k].position.y = off + cy - Math.cos(th) * cy;
      }
      const f = EXPLODE.fade(k, t) * Math.max(0, L.fade);
      G[k].visible = f > 0.003; fadeMats(layerMats[k], f);
    }
    const spin = 1 - smoother((t - 17) / 4) * 0.85;
    for (const ro of rotors) ro.rotation.y += dt * 8 * spin * ro.userData.dir;
    traces.children.forEach(tr => { tr.material.uniforms.uActive.value = smooth((t - 22) / 3); });
  });
}

/* =====================================================================
   GEOMETRY · L3 — PACKAGE + DIE (units: millimetres; origin = PCB top)
   GB202 public facts: 92.2 B transistors, ~750 mm², TSMC 4N.
   Block placement is ILLUSTRATIVE — not the real floorplan.
   ===================================================================== */
const DIE = (() => {
  const size = 27.4, half = 13.7, edge = 1.3, inner = half - edge;          // 27.4² ≈ 750 mm²
  const top = 1.92, smH = 0.06;
  const gpcGap = 0.25, gpcW = (inner * 2 - 5 * gpcGap) / 6;
  const smGap = 0.08, smColGap = 0.15, gpcShared = 0.6, l2Half = 1.5, l2Gap = 0.2;
  const rowSpan = inner - (l2Half + l2Gap) - gpcShared;
  const smD = (rowSpan - 7 * smGap) / 8, smW = (gpcW - smColGap) / 2;
  const sms = [];
  for (const h of [-1, 1]) for (let k = 0; k < 6; k++) for (let r = 0; r < 8; r++) for (let c = 0; c < 2; c++) {
    const x = -inner + k * (gpcW + gpcGap) + c * (smW + smColGap) + smW / 2;
    const z = h * (l2Half + l2Gap + r * (smD + smGap) + smD / 2);
    sms.push({ x, z, h, k, r, c });
  }
  const selIndex = sms.findIndex(s => s.h === -1 && s.k === 2 && s.r === 3 && s.c === 1);
  return { size, half, edge, inner, top, smH, smTop: top + smH, gpcGap, gpcW, smD, smW, gpcShared, l2Half, l2Gap, sms, selIndex, sel: sms[selIndex] };
})();

/* SM-level layout, normalized (a = x across the SM, b = z; b = 0 at −z).
   Shared by the die-tile shader (L3) and the extruded SM geometry (L4)
   so the two scales line up exactly during the crossfade. */
const SM_L = {
  pb: [[0.02, 0.02, 0.49, 0.36], [0.51, 0.02, 0.98, 0.36], [0.02, 0.38, 0.49, 0.72], [0.51, 0.38, 0.98, 0.72]],
  l1: [0.02, 0.75, 0.98, 0.88], tex: [0.02, 0.90, 0.98, 0.98],
};
const PB_L = { sched: [0.02, 0.03, 0.98, 0.12], reg: [0.02, 0.15, 0.98, 0.36], cores: [0.02, 0.40, 0.60, 0.97], tensor: [0.64, 0.40, 0.98, 0.97] };
const v4 = r => `vec4(${r.map(n => n.toFixed(4)).join(',')})`;

const GLSL_PB = `
vec3 pbCol(vec2 q, float seed, inout vec3 em){
  vec3 c=vec3(.14,.15,.16);
  if(inR(q,${v4(PB_L.sched)})>0.){ vec2 l=inRL(q,${v4(PB_L.sched)}); c=vec3(.44,.37,.55)*(.75+.4*cellRows(l*vec2(40.,3.),seed)); }
  else if(inR(q,${v4(PB_L.reg)})>0.){ vec2 l=inRL(q,${v4(PB_L.reg)}); c=vec3(.68,.48,.47)*(.7+.35*gridAA(l*vec2(8.,2.),.9))*(.85+.15*gridAA(l*vec2(64.,16.),.4)); }
  else if(inR(q,${v4(PB_L.cores)})>0.){ vec2 l=inRL(q,${v4(PB_L.cores)}); vec2 cell=l*vec2(8.,4.); vec2 f=fract(cell);
    float in_=step(.08,f.x)*step(f.x,.92)*step(.08,f.y)*step(f.y,.92);
    float mult=step(.08+.84*.04,f.x)*step(f.x,.08+.84*.55)*step(.08+.84*.28,f.y)*step(f.y,.08+.84*.8);
    vec3 core=mix(vec3(.62,.54,.36),vec3(.74,.46,.26),mult)*(.8+.25*cellRows(f*vec2(3.,8.),h21(floor(cell))));
    c=mix(vec3(.07,.075,.08),core,in_);
    float act=step(.72,h21(floor(cell)+floor(uTime*1.3+seed*.37)));
    em+=in_*act*vec3(.95,.62,.22)*.10*uAct; }
  else if(inR(q,${v4(PB_L.tensor)})>0.){ vec2 l=inRL(q,${v4(PB_L.tensor)}); c=vec3(.34,.56,.37)*(.7+.35*gridAA(l*vec2(16.,24.),.6)); em+=vec3(.25,.95,.45)*.035*uAct; }
  return c;
}`;

function createPackage(L) {
  const g = L.group;
  const M = {
    sub: L.reg(std(0xffffff, 0.35, 0.5, { map: TEX.substrate })),
    subSide: L.reg(std(0x1a241e, 0.3, 0.6)),
    fill: L.reg(std(0x0a0b0c, 0.2, 0.7)),
    die: L.reg(std(0x1b222b, 0.7, 0.22, { envMapIntensity: 1.1 })),
    cap: L.reg(std(0xa89468, 0.8, 0.35)),
    capDark: L.reg(std(0x2a2723, 0.4, 0.5)),
  };
  const subMesh = new THREE.Mesh(UNIT_BOX, [M.subSide, M.subSide, M.sub, M.subSide, M.subSide, M.subSide]);
  subMesh.scale.set(50, 1.1, 50); subMesh.position.y = 0.55; subMesh.receiveShadow = subMesh.castShadow = QL.shadows; g.add(subMesh);
  g.add(box(M.fill, 0, 1.16, 0, 28.6, 0.12, 28.6));
  g.add(box(M.die, 0, (1.22 + DIE.top) / 2, 0, DIE.size, DIE.top - 1.22, DIE.size));
  // decoupling capacitors around the die
  const caps = [], capsD = [];
  for (let i = 0; i < 220; i++) {
    const side = i % 4, t = rr(-19, 19), rad = rr(16.5, 22.5);
    const [x, z] = side === 0 ? [t, -rad] : side === 1 ? [t, rad] : side === 2 ? [-rad, t] : [rad, t];
    const rot = side < 2 ? 0 : Math.PI / 2;
    (rng() < 0.75 ? caps : capsD).push({ x, y: 1.1 + 0.25, z, w: 1.0, h: 0.5, d: 0.5, ry: rot });
  }
  g.add(instBoxes(M.cap, caps), instBoxes(M.capDark, capsD));

  // die surface blocks (kind encoded in seed: kind*1000 + index)
  const dieMat = L.reg(patternMaterial({ color: 0xffffff, metalness: 0.35, roughness: 0.42, envMapIntensity: 0.7 }, `
    ${GLSL_PB}
    vec3 pattern(vec3 p, vec3 n, vec3 sc, float seed, inout vec3 em){
      float kind=floor(seed/1000.), idx=seed-kind*1000.;
      if(n.y<.5) return vec3(.25,.26,.28);
      vec2 uv=p.xz+.5; vec3 c=vec3(.12);
      if(kind<.5){
        c=vec3(.10,.105,.11);
        ${SM_L.pb.map(r => `if(inR(uv,${v4(r)})>0.) c=pbCol(inRL(uv,${v4(r)}),idx,em);`).join('\n        ')}
        if(inR(uv,${v4(SM_L.l1)})>0.){ vec2 l=inRL(uv,${v4(SM_L.l1)}); c=vec3(.56,.57,.61)*(.7+.3*gridAA(l*vec2(8.,1.),.9))*(.85+.15*gridAA(l*vec2(80.,8.),.4)); }
        if(inR(uv,${v4(SM_L.tex)})>0.){ vec2 l=inRL(uv,${v4(SM_L.tex)}); float gp=step(.03,fract(l.x*4.))*step(fract(l.x*4.),.97); c=mix(vec3(.08),vec3(.46,.4,.33)*(.8+.3*cellRows(l*vec2(60.,4.),idx)),gp); }
        float sel=1.-step(.5,abs(idx-uSel));
        float edge=1.-inR(uv,vec4(.012,.018,.988,.982));
        em+=sel*uHi*vec3(.86,.9,.43)*(edge*2.5+.04);
      } else if(kind<1.5){ vec2 q=uv*sc.xz/.45; c=vec3(.6,.62,.66)*(.6+.4*gridAA(q,1.2))*(.85+.15*gridAA(q*vec2(24.,12.),.3)); }
      else if(kind<2.5){ vec2 q=uv*sc.xz/.07; c=vec3(.74,.43,.24)*(.55+.45*smoothstep(.3,.5,abs(fract(q.x)-.5)))*(.8+.2*gridAA(uv*sc.xz/.9,1.)); }
      else if(kind<3.5){ c=vec3(.42,.36,.3)*(.75+.3*cellRows(uv*sc.xz/.05,idx)); }
      else { c=vec3(.2,.21,.22)*(.8+.3*cellRows(uv*sc.xz/.03,idx)); }
      return c; }`, { uSel: { value: DIE.selIndex }, uHi: { value: 0 }, uAct: { value: 1 } }));
  const B = [];
  const T = DIE.top;
  DIE.sms.forEach((s, i) => B.push({ x: s.x, y: T + DIE.smH / 2, z: s.z, w: DIE.smW, h: DIE.smH, d: DIE.smD, seed: i }));
  for (let k = 0; k < 6; k++) {
    const x = -DIE.inner + k * (DIE.gpcW + DIE.gpcGap) + DIE.gpcW / 2;
    B.push({ x, y: T + 0.0225, z: 0, w: DIE.gpcW, h: 0.045, d: DIE.l2Half * 2, seed: 1000 + k });
    for (const h of [-1, 1]) B.push({ x, y: T + 0.0175, z: h * (DIE.inner - DIE.gpcShared / 2 + 0.02), w: DIE.gpcW, h: 0.035, d: DIE.gpcShared - 0.1, seed: 4000 + k * 2 + (h > 0) });
  }
  for (const h of [-1, 1]) for (let k = 0; k < 8; k++) B.push({ x: -12.6 + k * 3.2 + 1.5, y: T + 0.025, z: h * 13.0, w: 3.0, h: 0.05, d: 1.0, seed: 2000 + k + (h > 0) * 8 });
  for (const h of [-1, 1]) for (let k = 0; k < 5; k++) B.push({ x: h * 13.0, y: T + 0.02, z: -11.6 + k * 4.8 + 2.2, w: 1.0, h: 0.04, d: 4.4, seed: 3000 + k + (h > 0) * 5 });
  const dieBlocks = instBoxes(dieMat, B); g.add(dieBlocks);

  // on-die interconnect channels with travelling data (board trace → silicon interconnect)
  const links = new THREE.Group(); g.add(links);
  for (let k = 0; k < 7; k++) {
    const x = -DIE.inner - DIE.gpcGap / 2 + k * (DIE.gpcW + DIE.gpcGap);
    for (const h of [-1, 1]) links.add(createDataPulse(L, [[x, T + 0.065, h * 12.9], [x, T + 0.065, h * 6], [x, T + 0.065, h * 1.6]], 0.03,
      k % 2 ? 0xe8b862 : 0x86d7e2, { count: 2, speed: 0.3 + k * 0.03, base: 0.12, width: 0.06 }));
  }
  // scanning highlight across the die
  const scanMat = glowMat(0x9fe8ff, 0.9, { transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, opacity: 0 });
  const scan = box(scanMat, 0, T + 0.09, 0, DIE.size, 0.004, 0.35); scan.castShadow = scan.receiveShadow = false; g.add(scan);

  const S = DIE.sel;
  createFocusFrame(L, 0, T + 0.1, 0, DIE.size + 0.5, DIE.size + 0.5, [27.5, 29.5, 33, 35]);
  createFocusFrame(L, S.x, DIE.smTop + 0.012, S.z, DIE.smW + 0.04, DIE.smD + 0.04, [37.5, 39.5, 44, 46]);

  L.onUpdate(t => {
    const s = clamp((t - 33) / 5.5);
    scan.position.z = lerp(-13.5, 13.5, smooth(s)); scanMat.opacity = Math.sin(Math.PI * s) * 0.9 * Math.max(0, L.fade);
    scan.visible = s > 0 && s < 1;
    dieMat.userData.uniforms.uHi.value = win(t, 37, 40, 47, 52);
    links.children.forEach(l => { l.material.uniforms.uActive.value = win(t, 31, 34); });
  });
}
/* =====================================================================
   GEOMETRY · L4 — ONE SM / PROCESSING BLOCK (units: µm; origin = SM
   centre on top of the die tile). Public facts per SM partition:
   32 CUDA cores, 1 Tensor Core, 64 KB register file, 4 partitions/SM.
   Physical arrangement is ILLUSTRATIVE.
   ===================================================================== */
const SM = (() => {
  const W = DIE.smW * 1000, D = DIE.smD * 1000;
  const toXZ = (a, b) => [(a - 0.5) * W, (b - 0.5) * D];
  const rectXZ = r => { const [x0, z0] = toXZ(r[0], r[1]), [x1, z1] = toXZ(r[2], r[3]); return { x: (x0 + x1) / 2, z: (z0 + z1) / 2, w: x1 - x0, d: z1 - z0 }; };
  const sub = (outer, inner) => [outer[0] + (outer[2] - outer[0]) * inner[0], outer[1] + (outer[3] - outer[1]) * inner[1],
                                 outer[0] + (outer[2] - outer[0]) * inner[2], outer[1] + (outer[3] - outer[1]) * inner[3]];
  const H = { base: 2, sched: 10, reg: 16, core: 12, tensor: 20, l1: 14, tex: 12 };
  const pb0 = SM_L.pb[0];
  const coreRect = (pb, col, row) => {
    const c = sub(pb, PB_L.cores), cw = (c[2] - c[0]) / 8, cd = (c[3] - c[1]) / 4;
    return [c[0] + cw * (col + 0.08), c[1] + cd * (row + 0.08), c[0] + cw * (col + 0.92), c[1] + cd * (row + 0.92)];
  };
  const selCore = rectXZ(coreRect(pb0, 3, 1));
  return { W, D, toXZ, rectXZ, sub, H, pb0, coreRect, selCore, coreTop: H.base + H.core, pb0R: rectXZ(pb0),
           regR: rectXZ(sub(pb0, PB_L.reg)), schedR: rectXZ(sub(pb0, PB_L.sched)), tensorR: rectXZ(sub(pb0, PB_L.tensor)) };
})();

function createProcessingBlock(L) {
  const g = L.group, H = SM.H;
  const mat = L.reg(patternMaterial({ color: 0xffffff, metalness: 0.3, roughness: 0.45, envMapIntensity: 0.7 }, `
    vec3 pattern(vec3 p, vec3 n, vec3 sc, float seed, inout vec3 em){
      float kind=floor(seed/1000.), idx=seed-kind*1000.;
      vec2 uv=p.xz+.5, q=uv*sc.xz;          // q in µm
      float side=1.-step(.5,n.y);
      vec3 c;
      if(kind<.5){ c=vec3(.09,.095,.1)*(.8+.3*gridAA(q/40.,.3)); }
      else if(kind<1.5){ c=vec3(.44,.37,.55)*(.72+.4*cellRows(q/vec2(9.,6.),idx)); }
      else if(kind<2.5){ vec2 m=q/vec2(sc.x/8.,sc.z/2.); c=vec3(.68,.48,.47)*(.68+.35*gridAA(m,1.2))*(.8+.2*gridAA(q/2.2,.35)); }
      else if(kind<3.5){
        float mult=inR(uv,vec4(.04,.28,.55,.80));
        float shf=inR(uv,vec4(.59,.28,.96,.53)), regs=inR(uv,vec4(.03,.03,.97,.13));
        vec3 base=vec3(.62,.54,.36);
        base=mix(base,vec3(.76,.46,.26),mult); base=mix(base,vec3(.7,.5,.52),shf); base=mix(base,vec3(.55,.52,.46),regs);
        c=base*(.78+.3*cellRows(q/vec2(3.,1.6),idx));
        float act=step(.7,h21(vec2(idx,floor(uTime*1.3+idx*.37))));
        em+=act*vec3(.95,.62,.22)*.12*uAct*(1.-side);
        float sel=1.-step(.5,abs(idx-uSel)); em+=sel*uHi*vec3(.86,.9,.43)*.5*(1.-side)*(1.-inR(uv,vec4(.03,.03,.97,.97)));
      }
      else if(kind<4.5){ c=vec3(.34,.56,.37)*(.68+.35*gridAA(q/vec2(18.,12.),.8))*(.85+.15*gridAA(q/3.,.3)); em+=vec3(.25,.95,.45)*.04*uAct*(1.-side); }
      else if(kind<5.5){ c=vec3(.56,.57,.61)*(.68+.32*gridAA(q/vec2(sc.x/8.,sc.z),1.))*(.85+.15*gridAA(q/2.5,.3)); }
      else { c=vec3(.46,.4,.33)*(.78+.3*cellRows(q/vec2(4.,2.),idx)); }
      return mix(c,c*.55,side); }`, { uSel: { value: 0 }, uHi: { value: 0 }, uAct: { value: 1 } }));

  const B = [], add = (r, h, seed, y0 = H.base) => { const R = SM.rectXZ(r); B.push({ x: R.x, y: y0 + h / 2, z: R.z, w: R.w, h, d: R.d, seed }); };
  B.push({ x: 0, y: H.base / 2, z: 0, w: SM.W, h: H.base, d: SM.D, seed: 0 });
  let coreId = 0, selId = -1;
  SM_L.pb.forEach((pb, pi) => {
    add(SM.sub(pb, PB_L.sched), H.sched, 1000 + pi);
    add(SM.sub(pb, PB_L.reg), H.reg, 2000 + pi);
    add(SM.sub(pb, PB_L.tensor), H.tensor, 4000 + pi);
    for (let row = 0; row < 4; row++) for (let col = 0; col < 8; col++) {
      if (pi === 0 && col === 3 && row === 1) selId = coreId;
      add(SM.coreRect(pb, col, row), H.core, 3000 + coreId++);
    }
  });
  for (let k = 0; k < 8; k++) add([0.02 + k * 0.12, SM_L.l1[1], 0.02 + k * 0.12 + 0.114, SM_L.l1[3]], H.l1, 5000 + k);
  for (let k = 0; k < 4; k++) add([0.02 + k * 0.24, SM_L.tex[1], 0.02 + k * 0.24 + 0.23, SM_L.tex[3]], H.tex, 6000 + k);
  mat.userData.uniforms.uSel.value = selId;
  g.add(instBoxes(mat, B));

  // metal interconnect lines on top of the partition (thin bright traces)
  const wire = L.reg(std(0xc9ccd2, 1.0, 0.25, { emissive: 0x333333 }));
  const P = SM.pb0R, wires = [];
  for (let i = 0; i < 9; i++) wires.push({ x: P.x, y: H.base + 0.6, z: P.z - P.d / 2 + (i + 0.5) * P.d / 9, w: P.w, h: 0.8, d: 1.6 });
  g.add(instBoxes(wire, wires, { shadow: false }));

  // data paths: register file → selected core (operands), scheduler → cores (instruction), core → RF (write-back)
  const C = SM.selCore, R = SM.regR, S = SM.schedR, TC = SM.tensorR, yTop = H.base + H.reg + 6;
  const paths = new THREE.Group(); g.add(paths);
  paths.add(createDataPulse(L, [[R.x - 120, yTop, R.z], [C.x + 40, yTop + 4, R.z + R.d * 0.3], [C.x, yTop - 2, C.z - C.d * 0.7], [C.x, H.base + H.core + 2, C.z]],
    2.2, 0xe8b862, { count: 3, speed: 0.22, base: 0.2, width: 0.06 }));
  paths.add(createDataPulse(L, [[S.x - 260, H.base + H.sched + 5, S.z], [C.x - 60, yTop + 10, S.z + 20], [C.x - 12, yTop, C.z - C.d], [C.x - 12, H.base + H.core + 2, C.z - 6]],
    1.6, 0x86d7e2, { count: 2, speed: 0.18, base: 0.16, width: 0.05 }));
  paths.add(createDataPulse(L, [[C.x + 14, H.base + H.core + 2, C.z], [C.x + 30, yTop - 4, C.z - C.d * 0.8], [R.x + 60, yTop, R.z + R.d * 0.2], [R.x + 140, yTop - 2, R.z]],
    1.4, 0xe8b862, { count: 2, speed: 0.2, base: 0.1, width: 0.05 }));
  paths.add(createDataPulse(L, [[R.x + 300, yTop, R.z], [TC.x, H.base + H.tensor + 8, TC.z - TC.d * 0.4], [TC.x, H.base + H.tensor + 2, TC.z]],
    1.8, 0x7fe39a, { count: 2, speed: 0.16, base: 0.12, width: 0.06 }));

  createFocusFrame(L, P.x, H.base + H.tensor + 3, P.z, P.w + 10, P.d + 10, [43.5, 46, 50.5, 53]);
  createFocusFrame(L, C.x, SM.coreTop + 1.5, C.z, C.w + 3, C.d + 3, [56.5, 58.5, 61.5, 63.5]);
  L.onUpdate(t => {
    mat.userData.uniforms.uHi.value = win(t, 56, 58.5, 63, 66);
    paths.children.forEach((p, i) => { p.material.uniforms.uActive.value = win(t, 50 + i * 0.8, 52.5 + i * 0.8); });
  });
}

/* =====================================================================
   GEOMETRY · L5 — INSIDE ONE CUDA CORE (units: 0.1 µm; origin = core
   centre on top of its tile). A generic fused multiply-add floorplan.
   ===================================================================== */
const FMA = (() => {
  const W = SM.selCore.w * 10, D = SM.selCore.d * 10;
  const R = { regs: [0.03, 0.03, 0.97, 0.13], oper: [0.03, 0.16, 0.97, 0.24], mult: [0.04, 0.28, 0.55, 0.80], shift: [0.59, 0.28, 0.96, 0.53],
              add: [0.59, 0.57, 0.96, 0.80], norm: [0.04, 0.84, 0.50, 0.97], round: [0.54, 0.84, 0.96, 0.97] };
  const H = { base: 4, regs: 14, oper: 10, mult: 24, shift: 16, add: 18, norm: 12, round: 12 };
  const rect = r => ({ x: ((r[0] + r[2]) / 2 - 0.5) * W, z: ((r[1] + r[3]) / 2 - 0.5) * D, w: (r[2] - r[0]) * W, d: (r[3] - r[1]) * D });
  const target = { x: (0.30 - 0.5) * W, z: (0.55 - 0.5) * D, y: H.base + H.mult };   // where we dive into the multiplier
  return { W, D, R, H, rect, target };
})();

function createCudaCore(L) {
  const g = L.group, H = FMA.H;
  const mat = L.reg(patternMaterial({ color: 0xffffff, metalness: 0.25, roughness: 0.5, envMapIntensity: 0.6 }, `
    vec3 pattern(vec3 p, vec3 n, vec3 sc, float seed, inout vec3 em){
      float kind=floor(seed/1000.), idx=seed-kind*1000.;
      vec2 uv=p.xz+.5, q=uv*sc.xz;           // q in 0.1 µm
      float side=1.-step(.5,n.y); vec3 c;
      if(kind<.5){ c=vec3(.1,.105,.11)*(.8+.25*gridAA(q/12.,.3)); }
      else if(kind<1.5){ float s=smoothstep(.25,.45,abs(fract(q.x/5.)-.5)); c=mix(vec3(.3,.3,.32),vec3(.74,.72,.66),s)*(.85+.2*gridAA(q/vec2(5.,sc.z/3.),.4)); }
      else if(kind<2.5){ c=vec3(.66,.6,.5)*(.75+.3*cellRows(q/vec2(3.,2.4),idx)); }
      else if(kind<3.5){ vec2 m=q/vec2(9.,7.); vec2 f=fract(m); float cell=step(.1,f.x)*step(.1,f.y);
        float band=.85+.15*sin((m.x+m.y)*.6);
        c=mix(vec3(.25,.16,.1),vec3(.84,.52,.3)*band*(.8+.3*h21(floor(m))),cell)*(.85+.2*gridAA(q/1.5,.3));
        em+=cell*step(.86,h21(floor(m)+floor(uTime*2.+idx)))*vec3(1.,.6,.25)*.18*uAct*(1.-side); }
      else if(kind<4.5){ float hatch=smoothstep(.3,.5,abs(fract((q.x+q.y)/6.)-.5)); c=mix(vec3(.55,.36,.42),vec3(.8,.55,.62),hatch)*(.8+.2*gridAA(q/vec2(30.,8.),.5)); }
      else if(kind<5.5){ c=vec3(.72,.62,.4)*(.75+.3*cellRows(q/vec2(3.,2.4),idx+3.)); }
      else if(kind<6.5){ c=vec3(.6,.62,.5)*(.75+.3*cellRows(q/vec2(3.,2.4),idx+7.)); }
      else { c=vec3(.66,.52,.44)*(.75+.3*cellRows(q/vec2(3.,2.4),idx+11.)); }
      return mix(c,c*.5,side); }`, { uAct: { value: 1 } }));
  const B = [{ x: 0, y: H.base / 2, z: 0, w: FMA.W, h: H.base, d: FMA.D, seed: 0 }];
  const kinds = { regs: 1, oper: 2, mult: 3, shift: 4, add: 5, norm: 6, round: 7 };
  for (const k in kinds) { const r = FMA.rect(FMA.R[k]); B.push({ x: r.x, y: H.base + H[k] / 2, z: r.z, w: r.w, h: H[k], d: r.d, seed: kinds[k] * 1000 + kinds[k] }); }
  g.add(instBoxes(mat, B));

  // operand flow: A,B → multiplier, C → shifter, → adder → normalise → round → write back
  const y = 34, c = k => FMA.rect(FMA.R[k]);
  const flows = new THREE.Group(); g.add(flows);
  const M = c('mult'), S = c('shift'), A = c('add'), N = c('norm'), Rn = c('round'), Rg = c('regs');
  const f = (pts, col, opts) => flows.add(createDataPulse(L, pts, 0.9, col, opts));
  f([[Rg.x - 150, H.base + H.regs + 1, Rg.z], [M.x - 60, y, Rg.z + 30], [M.x - 60, H.base + H.mult + 1, M.z - 40]], 0xe8b862, { count: 2, speed: 0.25 });
  f([[Rg.x - 60, H.base + H.regs + 1, Rg.z], [M.x + 40, y, Rg.z + 30], [M.x + 40, H.base + H.mult + 1, M.z - 40]], 0xe8b862, { count: 2, speed: 0.25 });
  f([[Rg.x + 170, H.base + H.regs + 1, Rg.z], [S.x, y, Rg.z + 30], [S.x, H.base + H.shift + 1, S.z]], 0xe8b862, { count: 2, speed: 0.22 });
  f([[M.x + M.w * 0.3, H.base + H.mult + 1, M.z + 30], [A.x - A.w * 0.5, y - 4, A.z], [A.x, H.base + H.add + 1, A.z]], 0xf0c870, { count: 2, speed: 0.28 });
  f([[S.x, H.base + H.shift + 1, S.z + 20], [A.x, y, (S.z + A.z) / 2], [A.x, H.base + H.add + 1, A.z - 10]], 0xf0c870, { count: 2, speed: 0.28 });
  f([[A.x, H.base + H.add + 1, A.z + 20], [N.x + 60, y, (A.z + N.z) / 2], [N.x, H.base + H.norm + 1, N.z]], 0xf0c870, { count: 2, speed: 0.3 });
  f([[N.x + 80, H.base + H.norm + 1, N.z], [(N.x + Rn.x) / 2, y - 6, N.z], [Rn.x, H.base + H.round + 1, Rn.z]], 0xf0c870, { count: 2, speed: 0.3 });
  f([[Rn.x + 60, H.base + H.round + 1, Rn.z], [FMA.W * 0.47, y + 6, 0], [Rg.x + 240, H.base + H.regs + 1, Rg.z]], 0x86d7e2, { count: 2, speed: 0.2, base: 0.12 });

  const T = FMA.target;
  createFocusFrame(L, T.x, T.y + 0.6, T.z, 22, 22, [64.5, 66.5, 69, 71]);
  L.onUpdate(t => { flows.children.forEach((p, i) => { p.material.uniforms.uActive.value = win(t, 60.5 + i * 0.35, 62 + i * 0.35); }); });
}
/* =====================================================================
   GEOMETRY · L6 — TRANSISTORS + READING THE BIT (units: nm; origin =
   point on the multiplier surface). FinFET-style landscape; the bitcell
   is a GENERIC 6T SRAM cell — illustrative, not GB202 layout.
   Fins run along X, gates along Z. Wordline ∥ gates, bitlines ∥ fins.
   ===================================================================== */
const XT = { HS: 2300, finPitch: 30, gatePitch: 54, bit: { x: 432, z: -255 }, blOff: 45 };
XT.lattice = { x: XT.bit.x, y: 31, z: XT.bit.z + XT.blOff };     // channel of one access transistor

/** Keyhole cutaway: in render space the camera is always 1 unit from its
 *  target, so any fragment nearer than ~0.93 units and inside a view cone
 *  of half-angle atan(uKey) is between the camera and what it looks at. */
const KEYHOLE = { uKey: { value: 0 } };
function keyhole(m) {
  m.onBeforeCompile = sh => {
    sh.uniforms.uKey = KEYHOLE.uKey;
    sh.fragmentShader = sh.fragmentShader.replace('#include <common>', '#include <common>\nuniform float uKey;')
      .replace('#include <clipping_planes_fragment>', `#include <clipping_planes_fragment>
      if(uKey > .001 && vViewPosition.z < .93 && length(vViewPosition.xy) < uKey * vViewPosition.z) discard;`);
  };
  m.customProgramCacheKey = () => 'keyhole';
  return m;
}
function createTransistor(L) {
  const g = L.group, HS = XT.HS, B = XT.bit;
  const M = {
    sub: L.reg(std(0x252c36, 0.5, 0.35)),
    oxide: L.reg(std(0x2a3038, 0.2, 0.55)),
    fin: L.reg(std(0x7a8696, 0.55, 0.32)),
    gate: L.reg(std(0x858c95, 0.8, 0.36)),
    contact: L.reg(std(0xb8bec5, 1.0, 0.3)),
    m1: L.reg(std(0xa3a9b1, 1.0, 0.3)),
    via: L.reg(std(0xc6cbd1, 1.0, 0.25)),
    m2: L.reg(std(0xbcc1c7, 1.0, 0.28)),
  };
  Object.values(M).forEach(keyhole);
  g.add(box(M.sub, 0, -5, 0, HS * 2, 10, HS * 2), box(M.oxide, 0, 10, 0, HS * 2, 20, HS * 2));
  const fins = [], gates = [], contacts = [], m1 = [], vias = [], m2 = [];
  const segs = (len0, len1, gap, cb) => { let p = -HS; while (p < HS) { const L_ = rr(len0, len1), e = Math.min(HS, p + L_); cb(p, e); p = e + gap * rr(0.6, 1.4); } };
  const nearZ = (z, zs, r) => zs.some(v => Math.abs(z - v) < r);
  const blZ = [B.z - XT.blOff, B.z + XT.blOff];
  // fins (force continuous fins through the bitcell rows)
  for (let z = -HS + 15; z < HS; z += XT.finPitch) {
    if (nearZ(z, blZ, 5)) continue;                                           // bitcell fins drawn separately
    segs(150, 650, 70, (a, b) => fins.push({ x: (a + b) / 2, y: 21, z, w: b - a, h: 42, d: 7 }));
  }
  // gates
  for (let x = -HS; x < HS; x += XT.gatePitch) {
    if (Math.abs(x - B.x) < 5) continue;                                  // bitcell gate drawn separately
    segs(120, 520, 50, (a, b) => gates.push({ x, y: 47.5, z: (a + b) / 2, w: 16, h: 55, d: b - a }));
    for (let z = -HS + 15; z < HS; z += XT.finPitch * 2) if (rng() < 0.35) contacts.push({ x: x + 27, y: 62, z: z + rr(-8, 8), w: 13, h: 44, d: 13 });
  }
  // metal 1 (∥ x) and metal 2 (∥ z)
  for (let z = -HS + 20; z < HS; z += 40) {
    if (nearZ(z, blZ, 30)) continue;
    segs(80, 420, 90, (a, b) => { if (rng() < 0.62) m1.push({ x: (a + b) / 2, y: 105, z, w: b - a, h: 20, d: 14 }); });
  }
  for (let x = -HS + 32; x < HS; x += 64) {
    if (Math.abs(x - B.x) < 40) continue;
    segs(120, 600, 140, (a, b) => { if (rng() < 0.5) { m2.push({ x, y: 145, z: (a + b) / 2, w: 20, h: 30, d: b - a });
      if (rng() < 0.7) vias.push({ x, y: 122.5, z: rr(a, b), w: 14, h: 15, d: 14 }); } });
  }
  g.add(instBoxes(M.fin, fins), instBoxes(M.gate, gates));
  const metalGroup = new THREE.Group(); g.add(metalGroup);
  metalGroup.add(instBoxes(M.contact, contacts), instBoxes(M.m1, m1), instBoxes(M.via, vias), instBoxes(M.m2, m2));

  // ---- bitcell: wordline (M2 strap ∥ z) + access-transistor gate, bitlines (M1 ∥ x) ----
  const wlMat = L.reg(std(0x2a2d20, 0.6, 0.4, { emissive: new THREE.Color(0xd8ff4a), emissiveIntensity: 0 }));
  const blMat = L.reg(std(0x2a2d20, 0.6, 0.4, { emissive: new THREE.Color(0xd8ff4a), emissiveIntensity: 0 }));
  const blbMat = L.reg(std(0x2a2d20, 0.6, 0.4, { emissive: new THREE.Color(0xd8ff4a), emissiveIntensity: 0 }));

    update(t) { if (!ctx || !on) return; const depth = clamp(t / 90), now = ctx.currentTime;
      air.gain.setTargetAtTime(lerp(0.55, 0.05, smooth(depth * 1.6)), now, 0.5);
      airF.frequency.setTargetAtTime(lerp(420, 160, depth), now, 0.5);
      hum.gain.setTargetAtTime(lerp(0.035, 0.012, depth), now, 0.5);
      hiss.gain.setTargetAtTime(0.012 * win(t, 60, 70, 88, 96), now, 0.5); },
    onChapter(i) { if (i !== lastChapter && lastChapter !== -1) swell(); lastChapter = i; },
    /** stop producing sound while the tab is hidden */
    setHidden(h) { if (!ctx || !on) return; if (h) ctx.suspend(); else ctx.resume(); },
    /** output level (RMS, peak) — used by QA to confirm sound is produced and not clipping */
    level() { if (!analyser) return { state: 'off', rms: 0, peak: 0 }; const b = new Float32Array(analyser.fftSize); analyser.getFloatTimeDomainData(b);
      let s2 = 0, pk = 0; for (const v of b) { s2 += v * v; pk = Math.max(pk, Math.abs(v)); } return { state: ctx.state, rms: Math.sqrt(s2 / b.length), peak: pk }; },
  };
})();

/* =====================================================================
   INTERACTION — auto-play, pause, restart, explore, orbit, depth scrub
   ===================================================================== */
const STATE = { playing: true, explore: false, tT: 0, tD: 0, tV: 0,
  yaw: 0, yawV: 0, pitch: 0, pitchV: 0, yawTgt: 0, pitchTgt: 0, hx: 0, hy: 0, hxS: 0, hyS: 0,
  dragging: false, pointers: new Map(), pinch: 0, restartFade: 1, restarting: false, idle: 0 };
function setPlaying(p) {
  STATE.playing = p; const b = $('btn-play');
  b.textContent = p ? '❚❚ PAUSE' : '▶ PLAY'; b.setAttribute('aria-label', p ? 'Pause' : 'Play');
}
function setExplore(e) {
  STATE.explore = e; $('btn-explore').classList.toggle('on', e);
  $('hint').style.opacity = e ? '1' : '0';
  if (e) setPlaying(false); else { STATE.yawTgt = 0; STATE.pitchTgt = 0; }
}
function restart() { STATE.restarting = true; setPlaying(true); setExplore(false); }
function scrub(dt) { STATE.tT = clamp(STATE.tT + dt, 0, CONFIG.duration); STATE.idle = 0; }

function initInteraction() {
  $('btn-play').onclick = () => { if (STATE.tT >= CONFIG.duration - 0.05) restart(); else { setPlaying(!STATE.playing); if (STATE.playing) setExplore(false); } };
  $('btn-restart').onclick = restart;
  $('btn-explore').onclick = () => setExplore(!STATE.explore);
  $('btn-explain').onclick = () => setExplain(!STATE.explain);
  $('explain').addEventListener('click', e => {
    const b = e.target.closest('button[data-dir]'); if (!b) return;
    const j = clamp((HUD.exIndex ?? HUD.lastDepth) + +b.dataset.dir, 0, DEPTH.length - 1);
    if (j === HUD.exIndex) return;
    STATE.tT = Math.min(CONFIG.duration, WARP.toReal(DEPTH[j][1]) + 0.6);          // fly to that scene
    HUD.exLock = j === HUD.lastDepth ? null : j; renderExplain(j, true);
  });
  $('btn-sound').onclick = () => { const on = AUDIO.toggle(); $('btn-sound').textContent = on ? 'SOUND ON' : 'SOUND OFF'; $('btn-sound').classList.toggle('on', on); };
  $('btn-quality').onclick = () => { PERF.manualLow = !PERF.manualLow; $('btn-quality').textContent = PERF.manualLow ? 'LQ' : 'HQ'; applyQuality(); };
  $('btn-frame').onclick = () => { CONFIG.frame = CONFIG.frame === 'wide' ? 'full' : 'wide'; $('btn-frame').textContent = CONFIG.frame === 'wide' ? '16:9' : 'FULL'; layout(); };
  $('btn-frame').textContent = CONFIG.frame === 'wide' ? '16:9' : 'FULL';
  $('btn-quality').textContent = PERF.manualLow ? 'LQ' : 'HQ';

  const pr = $('progress');
  const seek = e => { const r = pr.getBoundingClientRect(); STATE.tT = clamp((e.clientX - r.left) / r.width) * CONFIG.duration; };
  pr.addEventListener('pointerdown', e => { seek(e); pr.setPointerCapture(e.pointerId); pr.onpointermove = seek; });
  const seekEnd = () => { pr.onpointermove = null; };
  pr.addEventListener('pointerup', seekEnd); pr.addEventListener('pointercancel', seekEnd);

  canvas.addEventListener('pointerdown', e => {
    canvas.setPointerCapture(e.pointerId); STATE.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    STATE.dragging = true; canvas.classList.add('dragging');
    if (STATE.pointers.size === 2) { const [a, b] = [...STATE.pointers.values()]; STATE.pinch = Math.hypot(a.x - b.x, a.y - b.y); }
  });
  canvas.addEventListener('pointermove', e => {
    STATE.hx = ((e.clientX - VIEW.left) / VIEW.w - 0.5) * 2; STATE.hy = ((e.clientY - VIEW.top) / VIEW.h - 0.5) * 2;
    const p = STATE.pointers.get(e.pointerId); if (!p) return;
    const dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY;
    if (STATE.pointers.size === 2) {
      const [a, b] = [...STATE.pointers.values()], dist = Math.hypot(a.x - b.x, a.y - b.y);
      scrub((dist - STATE.pinch) * 0.04); STATE.pinch = dist; return;
    }
    const k = STATE.explore ? 0.28 : 0.12, ymax = STATE.explore ? 75 : 16, pmax = STATE.explore ? 35 : 9;
    STATE.yawTgt = clamp(STATE.yawTgt - dx * k, -ymax, ymax);
    STATE.pitchTgt = clamp(STATE.pitchTgt + dy * k, -pmax, pmax);
    STATE.idle = 0;
  });
  const up = e => {
    STATE.pointers.delete(e.pointerId);
    if (STATE.pointers.size === 0) { STATE.dragging = false; canvas.classList.remove('dragging'); if (!STATE.explore) { STATE.yawTgt = 0; STATE.pitchTgt = 0; } }
  };
  canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', up);
  canvas.addEventListener('pointerleave', () => { STATE.hx = STATE.hy = 0; });
  stage.addEventListener('wheel', e => { e.preventDefault(); scrub(clamp(e.deltaY, -120, 120) * 0.012); }, { passive: false });
  addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); $('btn-play').click(); }
    else if (e.code === 'KeyR') restart();
    else if (e.code === 'KeyE') setExplore(!STATE.explore);
    else if (e.code === 'KeyI') setExplain(!STATE.explain);
    else if (e.code === 'ArrowRight' || e.code === 'ArrowDown') scrub(2);
    else if (e.code === 'ArrowLeft' || e.code === 'ArrowUp') scrub(-2);
  });
  document.addEventListener('visibilitychange', () => { LAST = performance.now(); AUDIO.setHidden(document.hidden); });
}

/* =====================================================================
   PERFORMANCE — layout, resolution, adaptive quality
   ===================================================================== */
const PERF = { scale: 1, manualLow: CONFIG.quality === 'low', acc: 0, frames: 0, cool: 0, good: 0, upWait: 3, sinceUp: 99 };
let VIEW = { w: 1, h: 1, left: 0, top: 0 };
function applyQuality() {
  const pr = (PERF.manualLow ? Math.min(1, QL.pixelRatio) : QL.pixelRatio) * PERF.scale;
  renderer.setPixelRatio(pr); composer.setPixelRatio(pr);
  renderer.shadowMap.enabled = QL.shadows && !PERF.manualLow;
  stage.classList.toggle('lq', PERF.manualLow);
  layout();
}
function layout() {
  const iw = innerWidth, ih = innerHeight;
  let w = iw, h = ih;
  if (CONFIG.frame === 'wide') { w = iw; h = Math.round(iw * 9 / 16); if (h > ih) { h = ih; w = Math.round(ih * 16 / 9); } }
  stage.style.width = w + 'px'; stage.style.height = h + 'px';
  stage.style.setProperty('--u', Math.max(0.75, Math.min(h, w * 9 / 16) / 800) + 'px');   // HUD unit: 1080p → 1.35px
  VIEW = { w, h, left: (iw - w) / 2, top: (ih - h) / 2 };   // #stage is centred in the window
  renderer.setSize(w, h, false); composer.setSize(w, h);
  const pr = renderer.getPixelRatio();
  bloom.resolution.set(w * pr * 0.5, h * pr * 0.5);
  finishPass.uniforms.uRes.value.set(w * pr, h * pr); finishPass.uniforms.uAspect.value = w / h;
  camera.aspect = w / h; camera.updateProjectionMatrix();
}
function adaptPerformance(dt) {
  PERF.acc += dt; PERF.frames++;
  if (PERF.acc < 2) return;
  const avg = PERF.acc / PERF.frames; PERF.acc = 0; PERF.frames = 0;
  if (PERF.cool > 0) { PERF.cool--; return; }
  // Every change reallocates the render targets (a visible hitch), so step up only after a
  // sustained good run, and wait twice as long each time a step up fails to hold.
  PERF.sinceUp++;
  if (avg > 1 / 40 && PERF.scale > 0.55) {
    if (PERF.sinceUp <= 4) PERF.upWait = Math.min(40, PERF.upWait * 2);
    PERF.scale = Math.max(0.55, PERF.scale - 0.15); PERF.good = 0; applyQuality(); PERF.cool = 2;
  } else if (avg < 1 / 58 && PERF.scale < 1) {
    if (++PERF.good >= PERF.upWait) { PERF.scale = Math.min(1, PERF.scale + 0.1); PERF.good = 0; PERF.sinceUp = 0; applyQuality(); PERF.cool = 3; }
  } else PERF.good = 0;
}

/* =====================================================================
   ANIMATION — main loop
   ===================================================================== */
let LAST = performance.now(), TIME = 0, STARTED = false, INTRO = 0;
const _dir = new THREE.Vector3();
function updateCamera(dt) {
  // timeline time with mass
  if (STATE.restarting) {
    STATE.restartFade = Math.max(0, STATE.restartFade - dt * 2.2);
    if (STATE.restartFade === 0) { STATE.tT = STATE.tD = STATE.tV = 0; STATE.restarting = false; }
  } else STATE.restartFade = Math.min(1, STATE.restartFade + dt * 1.2);
  if (STATE.playing && !STATE.restarting) { STATE.tT = Math.min(CONFIG.duration, STATE.tT + dt); if (STATE.tT >= CONFIG.duration) setPlaying(false); }
  [STATE.tD, STATE.tV] = spring(STATE.tD, STATE.tV, STATE.tT, 3.2, dt);
  const t = WARP.toStory(clamp(STATE.tD, 0, CONFIG.duration));          // story time drives every scene
  // orbit offsets (critically damped), hover parallax, handheld drift
  [STATE.yaw, STATE.yawV] = spring(STATE.yaw, STATE.yawV, STATE.yawTgt, STATE.dragging ? 14 : 2.4, dt);
  [STATE.pitch, STATE.pitchV] = spring(STATE.pitch, STATE.pitchV, STATE.pitchTgt, STATE.dragging ? 14 : 2.4, dt);
  STATE.hxS = lerp(STATE.hxS, IS_MOBILE ? 0 : STATE.hx, 1 - Math.exp(-dt * 2));
  STATE.hyS = lerp(STATE.hyS, IS_MOBILE ? 0 : STATE.hy, 1 - Math.exp(-dt * 2));
  const c = cameraAt(t);
  c.d *= lerp(c.pd, 1, clamp((camera.aspect - 0.5625) / (1 - 0.5625)));   // tall screens: back off where keys ask for it
  const drift = 0.22;
  const yaw = (c.yaw + STATE.yaw - STATE.hxS * 1.6 + Math.sin(TIME * 0.31) * drift + Math.sin(TIME * 0.83) * drift * 0.4) * DEG;
  const pitch = clamp(c.pitch + STATE.pitch + STATE.hyS * 1.0 + Math.sin(TIME * 0.27 + 1) * drift * 0.8, -80, 88) * DEG;
  _dir.set(Math.cos(pitch) * Math.sin(yaw), Math.sin(pitch), Math.cos(pitch) * Math.cos(yaw));
  camera.position.copy(_dir);                      // render space: target at origin, distance 1
  camera.up.set(0, 1, 0); camera.lookAt(0, 0, 0);
  camera.rotateZ(Math.sin(TIME * 0.19) * 0.004);
  const fov = c.fov * lerp(1, 0.74, clamp((camera.aspect - 0.5625) / (16 / 9 - 0.5625)));   // wide frame → tighter vertical FOV
  if (Math.abs(camera.fov - fov) > 1e-4) { camera.fov = fov; camera.updateProjectionMatrix(); }
  scene.fog.density = c.fog;
  finishPass.uniforms.uTilt.value = c.tilt * (QL === QUALITY.low || PERF.manualLow ? 0.6 : 1);
  bloom.strength = c.bloom;
  updateLights(yaw, clamp(1 - t / 20) * 0.4 + 0.6);
  keyLight.target.position.set(0, 0, 0);
  SHARED.uPx.value = VIEW.h * renderer.getPixelRatio() / (2 * Math.tan(camera.fov * DEG / 2));
  return t;
}
function updateLevels(t, dt) {
  const R = CAM.d, T = CAM.T;
  L2.shift = L3.shift = EXPLODE.riseShift(t);
  for (const L of LEVELS) {
    L.setFade(win(t, ...L.win));
    if (!L.group.visible) continue;
    const o = L.world(0, 0, 0);
    L.group.position.set((o[0] - T[0]) / R, (o[1] - T[1]) / R, (o[2] - T[2]) / R);
    L.group.scale.setScalar(L.scale / R);
    for (const fn of L.updaters) fn(t, dt, TIME);
  }
  for (const L of LEVELS) for (const o of L.lights) {
    const k = L.scale / R;
    const w = L.world(...o.p);
    o.l.position.set((w[0] - T[0]) / R, (w[1] - T[1]) / R, (w[2] - T[2]) / R);
    o.l.intensity = L.group.visible ? o.base * k * k * L.fade : 0;
  }
}
function tick(now) {
  requestAnimationFrame(tick);
  const dt = Math.min(0.05, Math.max(0.0001, (now - LAST) / 1000)); LAST = now;
  TIME += dt; SHARED.uTime.value = TIME;
  const t = updateCamera(dt);
  updateLevels(t, dt);
  updateHUD(t, VIEW.w, VIEW.h);
  AUDIO.update(t);
  INTRO = Math.min(1, INTRO + dt / 2.5);
  finishPass.uniforms.uFade.value = smooth(INTRO) * smooth(STATE.restartFade);
  composer.render(dt);
  if (STARTED) adaptPerformance(dt);
}

/* =====================================================================
   BOOTSTRAP — staged build with a minimal loading sequence
   ===================================================================== */
const frameWait = () => new Promise(r => requestAnimationFrame(() => r()));
async function bootstrap() {
  const step = $('load-step'), bar = $('load-bar'), pct = $('load-pct'), l1 = document.querySelector('#loader .l1');
  const steps = [
    ['GENERATING MATERIALS', () => buildTextures()],
    ['BUILDING DATA CENTER', () => createDataCenter(L0)],
    ['ASSEMBLING SERVER', () => createServerRack(L1)],
    ['LOADING GPU ARCHITECTURE', () => createGPU(L2)],
    ['LOADING GPU ARCHITECTURE · PACKAGE + DIE', () => createPackage(L3)],
    ['LOADING GPU ARCHITECTURE · PROCESSING BLOCK', () => createProcessingBlock(L4)],
    ['LOADING GPU ARCHITECTURE · CUDA CORE', () => createCudaCore(L5)],
    ['GROWING TRANSISTORS', () => createTransistor(L6)],
    ['CRYSTALLIZING SILICON', () => createSiliconLattice(L7)],
    ['BUILDING CAMERA TIMELINE', () => { TRACKS = buildCameraTimeline(); defineCallouts(); buildHUD(); initInteraction(); }],
    ['COMPILING SHADERS', () => {
      applyQuality(); cameraAt(0);
      // Warm-up: really draw every level once behind the loader, in both the cross-fading
      // (transparent) and the opaque state, so shader compiles and geometry/texture uploads
      // all happen here instead of as hitches the first time each scale comes into view.
      for (const L of LEVELS) { L.fade = -1; L.setFade(1); L.group.visible = true; }
      const mats = new Map(), culled = [];
      scene.traverse(o => {
        if (!o.material) return;
        if (o.frustumCulled) { culled.push(o); o.frustumCulled = false; }
        for (const m of [].concat(o.material)) if (!m.transparent) mats.set(m, m.depthWrite);
      });
      for (const m of mats.keys()) { m.transparent = true; m.depthWrite = false; m.needsUpdate = true; }
      composer.render(0);
      for (const [m, dw] of mats) { m.transparent = false; m.depthWrite = dw; m.needsUpdate = true; }
      composer.render(0);
      for (const o of culled) o.frustumCulled = true;
      for (const L of LEVELS) L.fade = -1;
    }],
  ];
  for (let i = 0; i < steps.length; i++) {
    step.textContent = steps[i][0];
    if (i === 3) l1.textContent = 'LOADING GPU ARCHITECTURE';
    await frameWait();
    steps[i][1]();
    const p = Math.round((i + 1) / steps.length * 100); bar.style.width = p + '%'; pct.textContent = p + '%';
  }
  let resizeQueued = false;                        // one render-target reallocation per frame while resizing
  addEventListener('resize', () => { if (resizeQueued) return; resizeQueued = true; requestAnimationFrame(() => { resizeQueued = false; layout(); }); });
  LAST = performance.now();
  requestAnimationFrame(tick);
  await frameWait(); await frameWait();
  const loader = $('loader'); loader.style.opacity = '0'; loader.style.pointerEvents = 'none';
  setTimeout(() => { loader.remove(); STARTED = true; }, 1700);
  if (params.has('qa'))                            // automated-test hook, only with ?qa in the URL
    window.__BW = { STATE, CAM, LEVELS, KEYS, cameraAt, renderer, scene, camera, bloom, finishPass, AUDIO, get t() { return STATE.tD; } };
}
bootstrap().catch(err => {
  console.error(err);
  const el = $('err'); el.style.display = 'flex'; el.textContent = 'VISUALIZATION FAILED TO START — ' + (err && err.message || err);
});
</script>
</body>
</html>
